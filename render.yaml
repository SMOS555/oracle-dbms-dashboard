services:
  - type: web
    name: oracle-dbms-dashboard
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Optional: Add live Neo4j AuraDB credentials below or directly in the Render dashboard:
      # - key: NEO4J_URI
      #   value: neo4j+s://xxxxxxxx.databases.neo4j.io
      # - key: NEO4J_USERNAME
      #   value: neo4j
      # - key: NEO4J_PASSWORD
      #   value: your-auradb-password
